<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LangChain RAG 文档问答助手</title>
<style>
  :root {
    --bg1:#0a0d15; --bg2:#0e1220;
    --panel: rgba(22,27,40,.66); --panel-solid:#161b28; --panel2:#1b2130;
    --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.14);
    --text:#e8ecf5; --muted:#8b95a7; --faint:#5b6577;
    --accent:#6366f1; --accent2:#22d3ee; --accent-grad: linear-gradient(135deg,#6366f1,#8b5cf6);
    --ok:#34d399; --warn:#fbbf24; --danger:#f87171;
    --radius:14px; --shadow: 0 10px 30px rgba(0,0,0,.35);
    --font: -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  }
  * { box-sizing: border-box; }
  html,body { height:100%; }
  body {
    margin:0; color:var(--text); font-family:var(--font); font-size:14px; line-height:1.6;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(99,102,241,.18), transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, rgba(34,211,238,.12), transparent 55%),
      linear-gradient(180deg,var(--bg1),var(--bg2));
    background-attachment: fixed;
  }
  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.12); border-radius:9px; }
  ::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,.2); }

  /* ---------- Header ---------- */
  header {
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:14px 22px; background:rgba(12,15,24,.72); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
  }
  .brand { display:flex; align-items:center; gap:12px; }
  .logo {
    width:38px; height:38px; border-radius:11px; background:var(--accent-grad);
    display:grid; place-items:center; font-size:19px; box-shadow:0 6px 18px rgba(99,102,241,.45);
  }
  .brand h1 { font-size:15.5px; margin:0; font-weight:650; letter-spacing:.2px; }
  .brand .sub { font-size:11.5px; color:var(--muted); margin-top:1px; }
  .grow { flex:1; }
  .pill {
    display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px;
    font-size:12px; border:1px solid var(--border); background:rgba(255,255,255,.03); white-space:nowrap;
  }
  .pill::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--muted); }
  .pill.ok { color:var(--ok); border-color:rgba(52,211,153,.4); }
  .pill.ok::before { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .pill.no { color:var(--warn); border-color:rgba(251,191,36,.4); }
  .pill.no::before { background:var(--warn); box-shadow:0 0 8px var(--warn); }

  .btn {
    border:none; border-radius:10px; padding:9px 16px; font-size:13px; font-weight:550; cursor:pointer;
    color:#fff; background:var(--accent-grad); box-shadow:0 6px 16px rgba(99,102,241,.35);
    transition:transform .12s ease, filter .12s ease, box-shadow .12s ease;
  }
  .btn:hover { filter:brightness(1.08); transform:translateY(-1px); }
  .btn:active { transform:translateY(0); }
  .btn.ghost { background:transparent; border:1px solid var(--border-strong); color:var(--text); box-shadow:none; }
  .btn.ghost:hover { background:rgba(255,255,255,.05); }
  .btn:disabled { opacity:.55; cursor:not-allowed; transform:none; filter:none; }

  /* ---------- Config bar ---------- */
  .config-bar {
    display:flex; gap:18px; align-items:flex-end; flex-wrap:wrap;
    padding:16px 22px; background:var(--panel); border-bottom:1px solid var(--border); backdrop-filter:blur(8px);
  }
  .field { display:flex; flex-direction:column; gap:6px; }
  .field > label { color:var(--muted); font-size:12px; font-weight:500; }
  .seg { display:inline-flex; padding:4px; gap:4px; background:rgba(0,0,0,.25); border:1px solid var(--border); border-radius:12px; }
  .seg label { position:relative; cursor:pointer; }
  .seg input { position:absolute; opacity:0; pointer-events:none; }
  .seg span {
    display:block; padding:7px 16px; border-radius:9px; font-size:13px; color:var(--muted);
    transition:all .15s ease; user-select:none;
  }
  .seg label:has(input:checked) span {
    color:#fff; background:var(--accent-grad); box-shadow:0 4px 12px rgba(99,102,241,.4);
  }
  .input-wrap { position:relative; display:flex; align-items:center; }
  .input-wrap input {
    width:100%; background:rgba(0,0,0,.28); color:var(--text); border:1px solid var(--border);
    border-radius:10px; padding:9px 38px 9px 12px; font-size:13px; outline:none; transition:border-color .15s, box-shadow .15s;
  }
  .input-wrap input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(99,102,241,.22); }
  .pw-toggle {
    position:absolute; right:8px; background:none; border:none; color:var(--muted); cursor:pointer; font-size:12px; padding:4px;
  }
  .pw-toggle:hover { color:var(--text); }

  /* ---------- Nav ---------- */
  nav {
    display:flex; gap:6px; padding:0 18px; background:var(--panel-solid); border-bottom:1px solid var(--border);
    overflow-x:auto;
  }
  nav button {
    background:transparent; border:none; color:var(--muted); padding:14px 16px; font-size:13.5px; font-weight:550;
    cursor:pointer; position:relative; white-space:nowrap; transition:color .15s;
  }
  nav button:hover { color:var(--text); }
  nav button.active { color:#fff; }
  nav button.active::after {
    content:""; position:absolute; left:12px; right:12px; bottom:-1px; height:2.5px; border-radius:3px;
    background:var(--accent-grad); box-shadow:0 0 10px rgba(99,102,241,.6);
  }

  /* ---------- Layout ---------- */
  main { padding:22px; max-width:1000px; margin:0 auto; }
  .tab { display:none; animation:fade .25s ease; }
  .tab.active { display:block; }
  @keyframes fade { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .card {
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; margin-bottom:18px; box-shadow:var(--shadow); backdrop-filter:blur(8px);
  }
  .card h3 { margin:0 0 12px; font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .hint { color:var(--muted); font-size:12.5px; margin:8px 0; }
  .err { color:var(--danger); }
  .row { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; }
  .row.between { justify-content:space-between; }
  code { background:rgba(0,0,0,.3); padding:1px 6px; border-radius:5px; font-size:12px; color:var(--accent2); }

  /* chips / stats */
  .stat { display:flex; gap:10px; flex-wrap:wrap; }
  .chip {
    display:inline-flex; align-items:center; gap:7px; padding:7px 13px; border-radius:999px; font-size:12.5px;
    background:rgba(255,255,255,.04); border:1px solid var(--border);
  }
  .chip b { color:#fff; font-weight:600; }
  .chip .dot { width:6px; height:6px; border-radius:50%; background:var(--accent2); }

  /* ---------- Chat ---------- */
  .chat-card { display:flex; flex-direction:column; }
  #chat { max-height:480px; overflow-y:auto; padding:6px 4px 6px 2px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:88%; padding:12px 15px; border-radius:14px; line-height:1.65; white-space:pre-wrap; word-break:break-word; animation:pop .2s ease; }
  @keyframes pop { from { opacity:0; transform:scale(.98); } to { opacity:1; transform:none; } }
  .msg .who { display:block; font-size:11px; color:var(--muted); margin-bottom:4px; }
  .msg.q { align-self:flex-end; background:linear-gradient(135deg,#6366f1,#7c3aed); color:#fff; border-bottom-right-radius:5px; }
  .msg.q .who { color:rgba(255,255,255,.8); }
  .msg.a { align-self:flex-start; background:var(--panel2); border:1px solid var(--border); border-bottom-left-radius:5px; }
  .src { margin-top:10px; border-top:1px dashed var(--border); padding-top:10px; }
  .src summary { cursor:pointer; color:var(--accent2); font-size:12px; user-select:none; }
  .src summary:hover { text-decoration:underline; }
  .src .item { background:rgba(0,0,0,.28); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-top:9px; }
  .sim { display:inline-flex; align-items:center; gap:8px; font-size:11.5px; font-weight:600; }
  .sim .badge { padding:2px 9px; border-radius:999px; border:1px solid currentColor; }
  .sim.hi { color:var(--ok); } .sim.mid { color:var(--warn); } .sim.lo { color:var(--faint); }
  .bar { flex:1; height:5px; border-radius:5px; background:rgba(255,255,255,.08); overflow:hidden; min-width:60px; }
  .bar > i { display:block; height:100%; border-radius:5px; background:currentColor; }

  .composer { display:flex; gap:10px; align-items:flex-end; margin-top:14px; }
  .composer textarea {
    flex:1; resize:none; background:rgba(0,0,0,.28); color:var(--text); border:1px solid var(--border);
    border-radius:12px; padding:11px 13px; font-size:13.5px; font-family:var(--font); outline:none; line-height:1.5;
    transition:border-color .15s, box-shadow .15s;
  }
  .composer textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(99,102,241,.22); }

  /* thinking dots */
  .dots { display:inline-flex; gap:4px; vertical-align:middle; }
  .dots i { width:6px; height:6px; border-radius:50%; background:var(--accent2); animation:bk 1s infinite ease-in-out; }
  .dots i:nth-child(2){ animation-delay:.15s; } .dots i:nth-child(3){ animation-delay:.3s; }
  @keyframes bk { 0%,80%,100%{ transform:scale(.5); opacity:.4; } 40%{ transform:scale(1); opacity:1; } }

  .spinner { display:inline-block; width:13px; height:13px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff;
    border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ---------- Search results / docs ---------- */
  .result { background:rgba(0,0,0,.22); border:1px solid var(--border); border-radius:12px; padding:13px 15px; margin-top:12px; }
  .result .meta { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .result .rank { width:22px; height:22px; border-radius:7px; background:var(--accent-grad); color:#fff;
    display:grid; place-items:center; font-size:12px; font-weight:600; }
  .result .body { white-space:pre-wrap; color:var(--text); font-size:13px; }

  ul.files { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:8px; }
  ul.files li { display:flex; align-items:center; gap:10px; padding:11px 14px; background:rgba(0,0,0,.22);
    border:1px solid var(--border); border-radius:11px; font-size:13.5px; }
  ul.files li .ic { font-size:16px; }
  .drop { border:1.5px dashed var(--border-strong); border-radius:12px; padding:18px; text-align:center; color:var(--muted);
    transition:border-color .15s, background .15s; cursor:pointer; }
  .drop:hover, .drop.drag { border-color:var(--accent); background:rgba(99,102,241,.08); color:var(--text); }
  .drop b { color:var(--accent2); }

  .empty { text-align:center; color:var(--faint); padding:34px 10px; }
  .empty .big { font-size:30px; opacity:.6; margin-bottom:8px; }

  /* ---------- Toast ---------- */
  #toasts { position:fixed; right:18px; bottom:18px; z-index:50; display:flex; flex-direction:column; gap:10px; }
  .toast {
    min-width:220px; max-width:340px; padding:12px 15px; border-radius:11px; font-size:13px; color:var(--text);
    background:rgba(20,24,36,.95); border:1px solid var(--border-strong); box-shadow:var(--shadow);
    backdrop-filter:blur(10px); display:flex; align-items:center; gap:10px; animation:tin .25s ease;
  }
  .toast.ok { border-left:3px solid var(--ok); }
  .toast.err { border-left:3px solid var(--danger); }
  .toast.info { border-left:3px solid var(--accent); }
  @keyframes tin { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:none; } }
  .toast .ic { font-size:16px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">📚</div>
    <div>
      <h1>LangChain RAG 文档问答助手</h1>
      <div class="sub">基于文档的智能问答 · Web 控制台</div>
    </div>
  </div>
  <div class="grow"></div>
  <span id="statusPill" class="pill muted">状态：加载中…</span>
  <button id="initBtn" class="btn">⚡ 初始化 / 重建索引</button>
</header>

<div class="config-bar">
  <div class="field">
    <label>模型提供商</label>
    <div class="seg" id="provRadios">
      <label><input type="radio" name="provider" value="deepseek" checked><span>DeepSeek</span></label>
      <label><input type="radio" name="provider" value="mimo"><span>MiMo</span></label>
      <label><input type="radio" name="provider" value="openai"><span>OpenAI</span></label>
    </div>
  </div>
  <div class="field" style="min-width:300px; flex:1">
    <label>API Key（留空则使用 .env / 环境变量）</label>
    <div class="input-wrap">
      <input type="password" id="apiKey" placeholder="粘贴对应模型的 API Key" autocomplete="off">
      <button type="button" class="pw-toggle" id="pwToggle">显示</button>
    </div>
  </div>
  <div class="field">
    <label>&nbsp;</label>
    <button class="btn ghost" id="saveCfg">保存配置</button>
  </div>
</div>

<nav>
  <button data-tab="qa" class="active">💬 问答</button>
  <button data-tab="search">🔍 检索</button>
  <button data-tab="docs">📄 文档</button>
  <button data-tab="history">🕘 历史</button>
  <button data-tab="settings">⚙️ 设置</button>
</nav>

<main>
  <!-- 问答 -->
  <section class="tab active" id="tab-qa">
    <div class="card"><div class="stat" id="qaStat"></div></div>
    <div class="card chat-card">
      <div id="chat">
        <div class="empty"><div class="big">💬</div>还没有对话，在下方输入问题开始吧</div>
      </div>
      <div class="composer">
        <textarea id="question" rows="2" placeholder="输入问题，回车发送（Shift+Enter 换行）"></textarea>
        <button id="askBtn" class="btn">发送</button>
      </div>
    </div>
  </section>

  <!-- 检索 -->
  <section class="tab" id="tab-search">
    <div class="card">
      <h3>🔍 向量检索</h3>
      <div class="row">
        <div class="field" style="flex:1; min-width:240px">
          <label>查询内容</label>
          <input type="text" id="searchQuery" placeholder="例如：什么是机器学习？">
        </div>
        <div class="field" style="width:130px">
          <label>返回条数 k</label>
          <input type="number" id="searchK" value="3" min="1" max="20">
        </div>
        <div class="field"><label>&nbsp;</label><button id="searchBtn" class="btn">检索</button></div>
      </div>
      <p class="hint">返回按相似度（cosine，越大越相关）排序的文档片段。</p>
      <div id="searchResults"></div>
    </div>
  </section>

  <!-- 文档 -->
  <section class="tab" id="tab-docs">
    <div class="card">
      <h3>📄 文档管理</h3>
      <p class="hint">程序启动时自动加载 <code>docs/</code> 下的所有 <code>.txt</code>。上传新文档后，请点右上角「⚡ 初始化 / 重建索引」使其生效。</p>
      <ul class="files" id="docList"></ul>
      <hr style="border:none; border-top:1px solid var(--border); margin:16px 0">
      <div class="drop" id="dropZone">
        点击选择或拖拽 <b>.txt</b> 文件到此处上传到 <code>docs/</code>
        <input type="file" id="uploadFile" accept=".txt" hidden>
      </div>
      <p id="uploadMsg" class="hint"></p>
    </div>
  </section>

  <!-- 历史 -->
  <section class="tab" id="tab-history">
    <div class="card">
      <div class="row between">
        <p class="hint" style="margin:0">本会话内的问答记录（刷新页面或重启服务会清空）。</p>
        <button class="btn ghost" id="clearHist">清空历史</button>
      </div>
      <div id="historyList" style="margin-top:14px"></div>
    </div>
  </section>

  <!-- 设置 -->
  <section class="tab" id="tab-settings">
    <div class="card">
      <h3>⚙️ 参数设置</h3>
      <div class="row">
        <div class="field" style="width:170px">
          <label>文本块大小 chunk_size</label>
          <input type="number" id="setChunkSize" value="500" min="50" max="4000" step="50">
        </div>
        <div class="field" style="width:170px">
          <label>重叠字符 chunk_overlap</label>
          <input type="number" id="setOverlap" value="50" min="0" max="1000" step="10">
        </div>
        <div class="field" style="width:150px">
          <label>检索条数 search_k</label>
          <input type="number" id="setK" value="3" min="1" max="20">
        </div>
        <div class="field"><label>&nbsp;</label><button id="saveSettings" class="btn">保存设置</button></div>
      </div>
      <p class="hint">修改参数后需重新「⚡ 初始化 / 重建索引」才能生效。</p>
      <p id="setMsg" class="hint"></p>
    </div>
  </section>
</main>

<div id="toasts"></div>

<script>
const $ = (s) => document.querySelector(s);
async function api(path, method = "GET", body = null) {
  const opt = { method, headers: {} };
  if (body !== null) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}

function toast(msg, type = "info") {
  const box = $("#toasts");
  const el = document.createElement("div");
  el.className = "toast " + type;
  const ic = type === "ok" ? "✅" : type === "err" ? "⚠️" : "ℹ️";
  el.innerHTML = `<span class="ic">${ic}</span><span>${escapeHtml(msg)}</span>`;
  box.appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transform = "translateX(20px)"; setTimeout(() => el.remove(), 250); }, 3200);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function simClass(v) { return v >= 0.7 ? "hi" : v >= 0.4 ? "mid" : "lo"; }
function simBar(v) {
  const pct = Math.max(0, Math.min(100, v * 100)).toFixed(0);
  return `<div class="sim ${simClass(v)}"><span class="badge">${v.toFixed(3)}</span><span class="bar"><i style="width:${pct}%"></i></span></div>`;
}

function setStatus(s) {
  const p = $("#statusPill");
  if (s.initialized) {
    p.className = "pill ok";
    p.textContent = `已建索引 · ${s.doc_count} 文档 / ${s.chunk_count} 块 · ${s.model_provider}`;
  } else {
    p.className = "pill no";
    p.textContent = `未初始化 · 模型 ${s.model_provider}`;
  }
}

async function refreshStatus() {
  try {
    const s = await api("/api/status");
    setStatus(s);
    $("#qaStat").innerHTML =
      `<span class="chip"><span class="dot"></span>模型 <b>${escapeHtml(s.model_provider)}</b></span>` +
      `<span class="chip">API Key <b>${s.has_key ? "已配置" : "未配置"}</b></span>` +
      `<span class="chip">索引 <b>${s.initialized ? "已建立" : "未建立"}</b></span>` +
      `<span class="chip">文档数 <b>${s.doc_count}</b></span>` +
      `<span class="chip">文本块 <b>${s.chunk_count}</b></span>`;
    $("#setChunkSize").value = s.chunk_size;
    $("#setOverlap").value = s.chunk_overlap;
    $("#setK").value = s.search_k;
    $("#searchK").value = s.search_k;   // 同步检索页的 k
  } catch (e) { console.error(e); }
}

async function refreshDocs() {
  try {
    const d = await api("/api/docs");
    const ul = $("#docList");
    ul.innerHTML = "";
    if (!d.files.length) {
      ul.innerHTML = '<li class="empty" style="padding:18px"><div class="big">📭</div>docs/ 下暂无 .txt 文件</li>';
      return;
    }
    d.files.forEach(f => {
      const li = document.createElement("li");
      li.innerHTML = `<span class="ic">📄</span><span>${escapeHtml(f)}</span>`;
      ul.appendChild(li);
    });
  } catch (e) { $("#docList").innerHTML = `<li class="err">${escapeHtml(e.message)}</li>`; }
}

// 标签切换
document.querySelectorAll("nav button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("nav button").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    $("#tab-" + b.dataset.tab).classList.add("active");
    if (b.dataset.tab === "history") refreshHistory();
    if (b.dataset.tab === "docs") refreshDocs();
  };
});

// API Key 显示/隐藏
$("#pwToggle").onclick = () => {
  const inp = $("#apiKey");
  const show = inp.type === "password";
  inp.type = show ? "text" : "password";
  $("#pwToggle").textContent = show ? "隐藏" : "显示";
};

// 切换模型提供商时清空 Key 输入框并刷新状态，避免误把上一家的 key 发给新模型
document.querySelectorAll('#provRadios input[name=provider]').forEach(r => {
  r.addEventListener("change", async () => {
    $("#apiKey").value = "";
    await refreshStatus();
  });
});

// 保存配置
$("#saveCfg").onclick = async () => {
  const provider = document.querySelector('input[name=provider]:checked').value;
  const apiKey = $("#apiKey").value.trim();
  try {
    await api("/api/config", "POST", { model_provider: provider, api_key: apiKey });
    await refreshStatus();
    toast("配置已保存，如更换模型或修改参数请点「初始化 / 重建索引」。", "ok");
  } catch (e) { toast("保存失败：" + e.message, "err"); }
};

// 初始化 / 重建索引
$("#initBtn").onclick = async () => {
  const btn = $("#initBtn");
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 初始化中…';
  try {
    const r = await api("/api/init", "POST");
    if (r.ok) toast(`索引建立完成：${r.doc_count} 文档 / ${r.chunk_count} 文本块`, "ok");
    else toast("初始化失败：" + r.error, "err");
  } catch (e) { toast("初始化失败：" + e.message, "err"); }
  btn.disabled = false; btn.innerHTML = "⚡ 初始化 / 重建索引";
  await refreshStatus();
};

// 问答
async function ask() {
  const q = $("#question").value.trim();
  if (!q) return;
  const chat = $("#chat");
  if (chat.querySelector(".empty")) chat.innerHTML = "";
  chat.insertAdjacentHTML("beforeend",
    `<div class="msg q"><span class="who">你</span>${escapeHtml(q)}</div>`);
  const waitId = "w" + Date.now();
  chat.insertAdjacentHTML("beforeend",
    `<div class="msg a" id="${waitId}"><span class="dots"><i></i><i></i><i></i></span> 思考中…</div>`);
  $("#question").value = "";
  try {
    const r = await api("/api/ask", "POST", { question: q });
    let html = `<span class="who">助手</span>${escapeHtml(r.answer)}`;
    if (r.sources && r.sources.length) {
      html += `<details class="src"><summary>参考来源（${r.sources.length} 条）</summary>`;
      r.sources.forEach(s => {
        html += `<div class="item">${simBar(s[1])}<div style="margin-top:7px">${escapeHtml(s[0])}</div></div>`;
      });
      html += `</details>`;
    }
    $("#" + waitId).innerHTML = html;
  } catch (e) {
    $("#" + waitId).innerHTML = `<span class="who">助手</span><span class="err">❌ ${escapeHtml(e.message)}</span>`;
  }
  chat.scrollTop = chat.scrollHeight;
}
$("#askBtn").onclick = ask;
$("#question").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
});

// 检索
$("#searchBtn").onclick = async () => {
  const query = $("#searchQuery").value.trim();
  const k = parseInt($("#searchK").value || "3", 10);
  const box = $("#searchResults");
  if (!query) { toast("请输入查询内容", "info"); return; }
  box.innerHTML = '<p class="hint"><span class="spinner"></span> 检索中…</p>';
  try {
    const r = await api("/api/search", "POST", { query, k });
    box.innerHTML = "";
    if (!r.results.length) { box.innerHTML = '<div class="empty"><div class="big">🔍</div>没有找到相关片段</div>'; return; }
    r.results.forEach((s, i) => {
      box.insertAdjacentHTML("beforeend",
        `<div class="result"><div class="meta"><span class="rank">${i + 1}</span>${simBar(s.similarity)}</div>` +
        `<div class="body">${escapeHtml(s.content)}</div></div>`);
    });
  } catch (e) { box.innerHTML = `<p class="err">❌ ${escapeHtml(e.message)}</p>`; }
};

// 上传文档（点击 + 拖拽）
const dropZone = $("#dropZone"), fileInput = $("#uploadFile");
dropZone.onclick = () => fileInput.click();
fileInput.onchange = () => { if (fileInput.files[0]) doUpload(fileInput.files[0]); };
["dragover", "dragenter"].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add("drag"); }));
["dragleave", "drop"].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove("drag"); }));
dropZone.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) doUpload(f); });

async function doUpload(f) {
  if (!f.name.toLowerCase().endsWith(".txt")) { toast("仅支持 .txt 文件", "err"); return; }
  const fd = new FormData(); fd.append("file", f);
  $("#uploadMsg").textContent = "上传中…";
  try {
    const r = await fetch("/api/upload", { method: "POST", body: fd });
    const d = await r.json();
    if (d.ok) { toast(`已上传 ${d.filename}，请点「初始化 / 重建索引」生效。`, "ok"); $("#uploadMsg").textContent = `✓ 已上传 ${d.filename}`; fileInput.value = ""; await refreshDocs(); }
    else toast("✗ " + (d.error || "上传失败"), "err");
  } catch (e) { toast("✗ " + e.message, "err"); }
}

// 历史
async function refreshHistory() {
  const box = $("#historyList");
  try {
    const r = await api("/api/history");
    box.innerHTML = "";
    if (!r.history.length) { box.innerHTML = '<div class="empty"><div class="big">🕘</div>暂无历史记录</div>'; return; }
    r.history.forEach(h => {
      box.insertAdjacentHTML("beforeend",
        `<div class="msg q" style="align-self:flex-end;max-width:92%"><span class="who">你</span>${escapeHtml(h.question)}</div>` +
        `<div class="msg a" style="max-width:92%"><span class="who">助手</span>${escapeHtml(h.answer)}</div>`);
    });
  } catch (e) { box.innerHTML = `<p class="err">${escapeHtml(e.message)}</p>`; }
}
$("#clearHist").onclick = () => { if (confirm("确定清空本会话历史？")) state_history_clear(); };
async function state_history_clear() {
  try { await api("/api/history/clear", "POST"); toast("历史已清空", "ok"); } catch (e) { toast("清空失败：" + e.message, "err"); }
  refreshHistory();
}

// 设置
$("#saveSettings").onclick = async () => {
  const provider = document.querySelector('input[name=provider]:checked').value;
  const body = {
    model_provider: provider,
    chunk_size: parseInt($("#setChunkSize").value, 10),
    chunk_overlap: parseInt($("#setOverlap").value, 10),
    search_k: parseInt($("#setK").value, 10),
  };
  if ($("#apiKey").value.trim()) body.api_key = $("#apiKey").value.trim();
  try {
    await api("/api/config", "POST", body);
    $("#setMsg").textContent = "✓ 设置已保存，请重新「初始化 / 重建索引」生效。";
    await refreshStatus();
    toast("设置已保存", "ok");
  } catch (e) { $("#setMsg").textContent = "✗ " + e.message; toast("保存失败：" + e.message, "err"); }
};

// 初始化页面
refreshStatus();
refreshDocs();
</script>
</body>
</html>
